services:
  - type: web
    name: hagiang-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm install --prefix backend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://bookhagiang.com
      - key: PUBLIC_API_URL
        value: https://bookhagiang.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_USERNAME
        value: haihg
      - key: ADMIN_DISPLAY_NAME
        value: haihg
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_RESET_VERSION
        value: initial-2026-08
